name: Build integration archive

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build:integration
      - uses: actions/upload-artifact@v4
        with:
          name: uc-dashboard
          path: |
            builds/*.tar.gz
            builds/*.sha256
