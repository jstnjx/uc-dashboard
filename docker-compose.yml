services:
  uc-dashboard:
    build: .
    container_name: uc-dashboard
    network_mode: host
    volumes:
      - ./data:/data
      - ./config:/config
    environment:
      - UC_DASHBOARD_LOG_LEVEL=info
      - TZ=Europe/Berlin
      - UC_INTEGRATION_INTERFACE=0.0.0.0
      - UC_INTEGRATION_HTTP_PORT=9090
      - DASHBOARD_PORT=11080
      - CHARGING_GATED=false
    restart: unless-stopped
